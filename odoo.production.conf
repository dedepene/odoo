[options]
# Admin password (change this!)
admin_passwd = $pbkdf2-sha512$600000$FiJkLMVY6937n7MW4tz7Hw$5.l3XDA5wqP.Iz2CHo.tKYI5wPedvsPOX9hFXrc1LHdyAWrpS2eSXQL1Ps5sfCL0bkSqWH7MQHnoq7bzG/SibA

# Module paths
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# Network interface
http_interface = 0.0.0.0
http_port = 8069

# CRITICAL: Enable proxy mode for Cloudflare
proxy_mode = True

# Database filter for multi-tenant subdomains
dbfilter = ^%d$

# Disable database listing (security)
list_db = False

# Database connection
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 64

# Logging
logfile = /var/log/odoo/odoo.log
log_level = info

# Performance tuning for LXC
# Memory limits: 6 GB hard, 5 GB soft
limit_memory_hard = 6442450944
limit_memory_soft = 5368709120
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

# Workers configuration
# For websockets to work through Cloudflare Tunnel, we need to handle
# both HTTP and websockets on the same port (8069)
# Option 1: Use workers=0 (threaded mode - simpler, works for most cases)
# Option 2: Keep workers and configure gevent on same port (more complex)

# Using threaded mode (no workers) - simpler and works with websockets
workers = 0
max_cron_threads = 2

# With workers=0, longpolling/websockets work on the same port (8069)
# No need for separate gevent_port
